name: Purge jsDelivr Cache on Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr Global Edge Nodes
        run: |
          # 1. Purge root repo cache
          curl -i -X GET "https://purge.jsdelivr.net/gh/tdalleaumc3/cloudmarketplacebanners@main/"
          
          # 2. Purge public directory
          curl -i -X GET "https://purge.jsdelivr.net/gh/tdalleaumc3/cloudmarketplacebanners@main/public/"
          
          # 3. Purge specific banners.json file
          curl -i -X GET "https://purge.jsdelivr.net/gh/tdalleaumc3/cloudmarketplacebanners@main/public/banners.json"
