name: Compile Banners JSON

on:
  push:
    paths:
      - 'data/banners/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Bundle JSON Files
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const path = "./data/banners";
            if (!fs.existsSync(path)) process.exit(0);

            // Set your CDN base domain here
            const CDN_BASE = "https://cdn.jsdelivr.net/gh/YOUR-ORG/YOUR-REPO@main";

            const files = fs.readdirSync(path).filter(f => f.endsWith(".json"));
            const banners = files.map(f => {
              const data = JSON.parse(fs.readFileSync(`${path}/${f}`, "utf8"));
              
              // Convert relative media paths to absolute CDN paths
              if (data.image && data.image.startsWith("/")) {
                data.image = encodeURI(`${CDN_BASE}${data.image}`);
              }
              return data;
            });

            fs.writeFileSync("./public/banners.json", JSON.stringify(banners, null, 2));
          '

      - name: Commit Compiled banners.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/banners.json
          
          if ! git diff --cached --quiet; then
            git commit -m "auto-compile: update public/banners.json [skip ci]"
            git push
          else
            echo "No changes to public/banners.json"
          fi
