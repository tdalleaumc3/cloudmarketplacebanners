name: Compile Banners JSON

on:
  push:
    paths:
      - 'data/banners/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bundle JSON Files
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const path = "./data/banners";
            if (!fs.existsSync(path)) process.exit(0);
            
            const files = fs.readdirSync(path).filter(f => f.endsWith(".json"));
            const banners = files.map(f => JSON.parse(fs.readFileSync(`${path}/${f}`, "utf8")));
            
            fs.writeFileSync("./public/banners.json", JSON.stringify(banners, null, 2));
          '

      - name: Commit Compiled banners.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/banners.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto-compile: update public/banners.json"
          git push
